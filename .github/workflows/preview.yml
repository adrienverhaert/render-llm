name: Preview package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build and verify Windows preview ZIP
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check repository contents
        run: node tools/check-repository.mjs --self-test
      - run: node tools/check-repository.mjs
      - name: Check documentation
        run: python tools/check-doc-links.py --self-test
      - run: python tools/check-doc-links.py
      - name: Install the pinned Qt package
        shell: pwsh
        run: |
          python -m venv build/qt-installer
          build/qt-installer/Scripts/python.exe -m pip install aqtinstall==3.3.0
          build/qt-installer/Scripts/python.exe -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 --archives qtbase -O build/qt
      - name: Verify source and GPU inputs
        shell: pwsh
        run: |
          ./tools/fetch-native-sources.ps1
          ./tools/fetch-gpu-runtime.ps1
      - name: Build and stage the native application
        shell: pwsh
        run: ./tools/build-native.ps1 -QtPrefix build/qt/5.15.2/msvc2019_64 -DependencyRoot build/dependencies -OidnBin build/gpu-runtime/verified -DxcBin build/gpu-runtime/verified
      - name: Verify the document and agent
        shell: pwsh
        run: |
          ctest --test-dir build/native -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix ASSISTANT test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract and verify the candidate archive
        shell: pwsh
        run: ./tools/package-local-test.ps1 -Runtime build/native/Release -Destination build/preview-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-llm-windows-x64-preview
          path: build/preview-package/render-llm-local-test.zip
          if-no-files-found: error
          retention-days: 7
